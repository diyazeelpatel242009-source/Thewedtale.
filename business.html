<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business — The Wed Tale</title><link rel="stylesheet" href="style.css"></head><body><nav class="site-nav"><a class="brand" href="index.html">THE WED TALE<small>GUJARAT</small></a><div class="navlinks" style="display:flex"><a href="directory.html">Directory</a><a href="auth.html?type=couple">Couple login</a></div></nav><main class="page"><p class="eyebrow">THE DIRECTORY</p><div id="loading" class="loading">Loading business profile…</div><div id="content" class="detail-grid hidden"><section class="detail-main"><p id="category" class="eyebrow"></p><h1 id="businessName"></h1><p id="city" class="lede"></p><div class="rule"></div><p id="description" class="description"></p><div id="coverWrap" class="hidden" style="margin-top:25px"><img id="cover" alt="Business cover" style="width:100%;max-height:540px;object-fit:cover"></div><div class="actions"><a id="websiteLink" class="btn-outline hidden" target="_blank" rel="noopener">VISIT WEBSITE →</a><a id="instagramLink" class="btn-outline hidden" target="_blank" rel="noopener">INSTAGRAM →</a></div></section><aside><section class="panel"><h2>Connect with this business.</h2><div id="priceDetail" class="detail-meta"><span>Price range</span><strong id="price"></strong></div><div id="phoneDetail" class="detail-meta"><span>Phone</span><strong id="phone"></strong></div><div id="loginNotice" class="hidden"><p class="muted">Log in with a couple account to send an enquiry.</p><a class="btn" href="auth.html?type=couple">COUPLE LOGIN →</a></div><form id="enquiryForm"><div class="field"><label for="weddingDate">WEDDING DATE</label><input id="weddingDate" type="date"></div><div class="field"><label for="location">WEDDING CITY / LOCATION</label><input id="location" maxlength="200" placeholder="City or venue"></div><div class="field"><label for="guestCount">GUEST COUNT</label><input id="guestCount" type="number" min="1" max="100000" placeholder="e.g. 250"></div><div class="field"><label for="message">YOUR MESSAGE</label><textarea id="message" maxlength="3000" placeholder="Tell the business what you are looking for."></textarea></div><button class="btn" type="submit" style="width:100%">SEND ENQUIRY →</button></form><div id="enquiryNote" class="notice"></div></section></aside></div></main><footer class="footer"><a href="directory.html">← BACK TO DIRECTORY</a><span>THE WED TALE GUJARAT</span></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="app.js"></script><script>
let currentUser=null,business=null;const id=new URLSearchParams(location.search).get('id');const $=id=>document.getElementById(id);async function init(){if(!configured()){$('loading').textContent=configMessage();return}if(!id){$('loading').textContent='No business ID was provided.';return}const {data,error}=await supabaseClient.from('businesses').select('id,name,category,city,description,phone,instagram,website,price_range,cover_image_url,status').eq('id',id).eq('status','approved').maybeSingle();if(error||!data){$('loading').textContent='This business could not be found or is not currently approved.'+(error?' '+error.message:'');return}business=data;$('category').textContent=business.category||'WEDDING BUSINESS';$('businessName').textContent=business.name;$('city').textContent=business.city||'Gujarat';$('description').textContent=business.description||'A wedding business listed on The Wed Tale.';if(business.cover_image_url){$('cover').src=business.cover_image_url;$('coverWrap').classList.remove('hidden')}if(business.price_range)$('price').textContent=business.price_range;else $('priceDetail').classList.add('hidden');if(business.phone)$('phone').textContent=business.phone;else $('phoneDetail').classList.add('hidden');if(business.website){$('websiteLink').href=business.website;$('websiteLink').classList.remove('hidden')}if(business.instagram){let u=business.instagram.startsWith('http')?business.instagram:'https://instagram.com/'+business.instagram.replace(/^@/,'');$('instagramLink').href=u;$('instagramLink').classList.remove('hidden')}try{const session=await getSession();if(session){const profile=await getProfile(session.user.id);if(profile&&profile.role==='couple')currentUser=session.user}}catch(e){}if(!currentUser){$('enquiryForm').classList.add('hidden');$('loginNotice').classList.remove('hidden')}$('loading').classList.add('hidden');$('content').classList.remove('hidden')}
$('enquiryForm').addEventListener('submit',async e=>{e.preventDefault();if(!currentUser||!business)return;const btn=e.currentTarget.querySelector('button');btn.disabled=true;btn.textContent='SENDING…';const guest=$('guestCount').value;const payload={couple_id:currentUser.id,business_id:business.id,wedding_date:$('weddingDate').value||null,location:$('location').value.trim()||null,guest_count:guest?Number(guest):null,message:$('message').value.trim()||null};try{const {error}=await supabaseClient.from('enquiries').insert(payload);if(error)throw error;showNotice('enquiryNote','Your enquiry has been sent. Track it from your couple dashboard.','success');e.currentTarget.reset()}catch(err){showNotice('enquiryNote','Could not send enquiry: '+err.message,'error')}finally{btn.disabled=false;btn.textContent='SEND ENQUIRY →'}});init();
</script></body></html>
