<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Directory — The Wed Tale</title><link rel="stylesheet" href="style.css"></head><body><nav class="site-nav"><a class="brand" href="index.html">THE WED TALE<small>GUJARAT</small></a><button class="nav-toggle" id="navToggle">MENU</button><div class="navlinks" id="navLinks"><a href="index.html">Home</a><a href="auth.html?type=couple">Couple account</a><a href="auth.html?type=business">List business</a></div></nav><main class="page"><header class="page-heading"><div><p class="eyebrow">THE DIRECTORY</p><h1 class="page-title">Find your<br><em>people.</em></h1></div><p class="lede">Search approved wedding venues and vendors across Gujarat. New listings appear after review.</p></header><div class="filters"><input id="searchInput" type="search" placeholder="Search name or service…"><select id="categoryFilter"><option value="">All categories</option><option>Venue</option><option>Photographer</option><option>Planner</option><option>Decorator</option><option>Catering</option><option>Makeup Artist</option><option>Mehendi</option><option>Jewellery</option><option>Bridal Wear</option><option>Groom Wear</option><option>Invitation</option><option>Entertainment</option><option>Other</option></select><input id="cityFilter" type="search" placeholder="City"><button class="btn-outline" id="clearFilters">CLEAR</button></div><div class="section-head"><p id="resultCount" class="smallcaps">Loading directory…</p><a class="text-link" href="auth.html?type=business">List your business →</a></div><section id="businessGrid" class="grid"><div class="empty">Loading approved businesses…</div></section></main><footer class="footer"><span>© THE WED TALE GUJARAT</span><a href="index.html">Home</a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="app.js"></script><script>
let businesses=[];const $=id=>document.getElementById(id);function render(){const q=$('searchInput').value.trim().toLowerCase(),cat=$('categoryFilter').value.toLowerCase(),city=$('cityFilter').value.trim().toLowerCase();const list=businesses.filter(b=>(!q||[b.name,b.category,b.city,b.description].some(v=>String(v||'').toLowerCase().includes(q)))&&(!cat||String(b.category||'').toLowerCase()===cat)&&(!city||String(b.city||'').toLowerCase().includes(city)));$('resultCount').textContent=list.length+' APPROVED '+(list.length===1?'BUSINESS':'BUSINESSES');$('businessGrid').innerHTML=list.length?list.map(b=>`<article class="business-card"><div class="card-image">${b.cover_image_url?`<img src="${esc(b.cover_image_url)}" alt="${esc(b.name)}" loading="lazy">`:'<span class="smallcaps">THE WED TALE · GUJARAT</span>'}</div><div class="card-body"><span class="eyebrow">${esc(b.category||'Wedding business')}</span><h2>${esc(b.name)}</h2><p>${esc(b.city||'Gujarat')}${b.price_range?' · '+esc(b.price_range):''}</p><p>${esc((b.description||'Discover this wedding professional.').slice(0,140))}${(b.description||'').length>140?'…':''}</p><div class="card-foot"><a class="text-link" href="business.html?id=${encodeURIComponent(b.id)}">VIEW PROFILE →</a></div></div></article>`).join(''):'<div class="empty">No approved listings match these filters yet. Try a different search, or check back soon.</div>'}
async function init(){if(!configured()){$('businessGrid').innerHTML='<div class="empty">'+esc(configMessage())+'</div>';return}const {data,error}=await supabaseClient.from('businesses').select('id,name,category,city,description,phone,instagram,website,price_range,status,cover_image_url,created_at').eq('status','approved').order('created_at',{ascending:false});if(error){$('businessGrid').innerHTML='<div class="empty">Could not load directory: '+esc(error.message)+'</div>';return}businesses=data||[];const params=new URLSearchParams(location.search);if(params.get('category'))$('categoryFilter').value=params.get('category');render()}['searchInput','categoryFilter','cityFilter'].forEach(id=>$(id).addEventListener('input',render));$('clearFilters').onclick=()=>{$('searchInput').value='';$('categoryFilter').value='';$('cityFilter').value='';render()};init();
</script></body></html>
