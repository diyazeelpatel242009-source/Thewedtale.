
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard — The Wed Tale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <a class="brand" href="index.html">
    THE WED TALE
    <small>GUJARAT</small>
  </a>
  <button class="btn-outline" data-logout>Log out</button>
</nav>

<main class="page">
  <header class="dashboard-head">
    <p class="eyebrow">ADMIN PANEL</p>
    <h1>Control<br><em>the tale.</em></h1>
    <p class="lede">
      Review business listings and wedding stories before publishing.
    </p>
  </header>

  <div id="adminNotice" class="notice" role="status" aria-live="polite"></div>

  <section class="section" style="padding-left:0;padding-right:0">
    <div class="section-head">
      <div>
        <p class="eyebrow">BUSINESSES</p>
        <h2>Review listings.</h2>
      </div>
      <button id="refreshBusinesses" class="btn-outline" type="button">
        REFRESH
      </button>
    </div>

    <div class="auth-switch">
      <button type="button" data-bfilter="pending" class="active">PENDING</button>
      <button type="button" data-bfilter="approved">APPROVED</button>
      <button type="button" data-bfilter="rejected">REJECTED</button>
    </div>

    <div id="businessList" class="list">
      <div class="empty">Checking access…</div>
    </div>
  </section>

  <section class="section" style="padding-left:0;padding-right:0">
    <div class="section-head">
      <div>
        <p class="eyebrow">REAL WEDDINGS</p>
        <h2>Review submissions.</h2>
      </div>
      <button id="refreshWeddings" class="btn-outline" type="button">
        REFRESH
      </button>
    </div>

    <div class="auth-switch">
      <button type="button" data-wfilter="pending" class="active">PENDING</button>
      <button type="button" data-wfilter="approved">APPROVED</button>
      <button type="button" data-wfilter="rejected">REJECTED</button>
    </div>

    <div id="weddingList" class="list">
      <div class="empty">Checking access…</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>

<script>
"use strict";

const adminEl = (id) => document.getElementById(id);

let businessFilter = "pending";
let weddingFilter = "pending";
let adminAuthorized = false;

function adminNotice(message, type = "") {
  const el = adminEl("adminNotice");
  el.textContent = message;
  el.className = "notice show" + (type ? " " + type : "");
}

function setLoading(id, message) {
  adminEl(id).replaceChildren();
  const item = document.createElement("div");
  item.className = "empty";
  item.textContent = message;
  adminEl(id).appendChild(item);
}

function setListMessage(id, message) {
  setLoading(id, message);
}

function makeButton(label, action, id, styleClass) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = styleClass;
  button.textContent = label;
  button.dataset.action = action;
  button.dataset.id = String(id);
  return button;
}

function makeBusinessCard(b) {
  const article = document.createElement("article");
  article.className = "list-item";

  const heading = document.createElement("div");
  heading.className = "section-head";

  const details = document.createElement("div");
  const title = document.createElement("h3");
  title.textContent = b.name || "Untitled business";

  const subtitle = document.createElement("p");
  subtitle.textContent =
    (b.category || "Wedding business") +
    (b.city ? " · " + b.city : "");

  details.append(title, subtitle);

  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = b.status || "unknown";

  heading.append(details, badge);

  const description = document.createElement("p");
  description.textContent = b.description || "No description provided.";

  article.append(heading, description);

  const actions = document.createElement("div");
  actions.className = "inline-actions";

  if (businessFilter !== "approved") {
    actions.appendChild(
      makeButton("APPROVE", "business-approved", b.id, "btn")
    );
  }

  if (businessFilter !== "rejected") {
    actions.appendChild(
      makeButton("REJECT", "business-rejected", b.id, "btn-outline")
    );
  }

  article.appendChild(actions);
  return article;
}

function makeWeddingCard(w) {
  const article = document.createElement("article");
  article.className = "list-item";

  const heading = document.createElement("div");
  heading.className = "section-head";

  const details = document.createElement("div");
  const title = document.createElement("h3");
  title.textContent = w.title || "Untitled wedding submission";

  const subtitle = document.createElement("p");
  const date = w.created_at
    ? new Date(w.created_at).toLocaleDateString()
    : "";

  subtitle.textContent = [w.city, date].filter(Boolean).join(" · ");

  details.append(title, subtitle);

  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = w.status || "unknown";

  heading.append(details, badge);

  const story = document.createElement("p");
  story.textContent = w.story || "No story provided.";

  article.append(heading, story);

  const actions = document.createElement("div");
  actions.className = "inline-actions";

  if (weddingFilter !== "approved") {
    actions.appendChild(
      makeButton("APPROVE", "wedding-approved", w.id, "btn")
    );
  }

  if (weddingFilter !== "rejected") {
    actions.appendChild(
      makeButton("REJECT", "wedding-rejected", w.id, "btn-outline")
    );
  }

  article.appendChild(actions);
  return article;
}

async function loadBusinesses() {
  if (!adminAuthorized) return;

  setLoading("businessList", "Loading businesses…");

  try {
    const { data, error } = await supabaseClient
      .from("businesses")
      .select("id,name,category,city,description,status,created_at")
      .eq("status", businessFilter)
      .order("created_at", { ascending: false });

    if (error) throw error;

    const list = adminEl("businessList");
    list.replaceChildren();

    if (!data || data.length === 0) {
      setListMessage(
        "businessList",
        "No " + businessFilter + " businesses found."
      );
      return;
    }

    data.forEach((business) => {
      list.appendChild(makeBusinessCard(business));
    });
  } catch (error) {
    setListMessage("businessList", "Could not load businesses: " + error.message);
    adminNotice(
      "Business loading failed. Check the displayed error and Supabase permissions.",
      "error"
    );
  }
}

async function loadWeddings() {
  if (!adminAuthorized) return;

  setLoading("weddingList", "Loading wedding submissions…");

  try {
    const { data, error } = await supabaseClient
      .from("wedding_submissions")
      .select("id,title,city,story,status,created_at")
      .eq("status", weddingFilter)
      .order("created_at", { ascending: false });

    if (error) throw error;

    const list = adminEl("weddingList");
    list.replaceChildren();

    if (!data || data.length === 0) {
      setListMessage(
        "weddingList",
        "No " + weddingFilter + " wedding submissions found."
      );
      return;
    }

    data.forEach((wedding) => {
      list.appendChild(makeWeddingCard(wedding));
    });
  } catch (error) {
    setListMessage("weddingList", "Could not load submissions: " + error.message);
    adminNotice(
      "Wedding submissions could not load. Check the displayed error and Supabase permissions.",
      "error"
    );
  }
}

async function updateStatus(table, id, status, kind) {
  if (!adminAuthorized) {
    adminNotice("Admin authorization is required.", "error");
    return;
  }

  const noun = kind === "business" ? "business listing" : "wedding submission";

  if (!window.confirm("Are you sure you want to " + status + " this " + noun + "?")) {
    return;
  }

  adminNotice("Updating status…");

  try {
    const { data, error } = await supabaseClient
      .from(table)
      .update({ status: status })
      .eq("id", id)
      .select("id,status");

    if (error) throw error;

    if (!data || data.length === 0) {
      throw new Error(
        "No row was updated. Check that your account has the required admin permission in Supabase RLS."
      );
    }

    adminNotice(
      noun.charAt(0).toUpperCase() + noun.slice(1) + " " + status + ".",
      "success"
    );

    if (kind === "business") {
      await loadBusinesses();
    } else {
      await loadWeddings();
    }
  } catch (error) {
    adminNotice(
      "Could not update status: " + error.message,
      "error"
    );
  }
}

async function initAdmin() {
  if (!configured()) {
    adminNotice(configMessage(), "error");
    setListMessage("businessList", "Supabase is not configured.");
    setListMessage("weddingList", "Supabase is not configured.");
    return;
  }

  try {
    const session = await getSession();

    if (!session) {
      location.href = "auth.html";
      return;
    }

    const profile = await getProfile(session.user.id);

    if (!profile || profile.role !== "admin") {
      adminEl("businessList").replaceChildren();
      adminEl("weddingList").replaceChildren();

      const panel = document.createElement("section");
      panel.className = "panel";

      const heading = document.createElement("h2");
      heading.textContent = "Admin access required";

      const message = document.createElement("p");
      message.textContent =
        "This account is not assigned the admin role. No listing actions are available.";

      const home = document.createElement("a");
      home.className = "btn";
      home.href = "index.html";
      home.textContent = "HOME";

      panel.append(heading, message, home);
      adminEl("businessList").appendChild(panel);
      return;
    }

    adminAuthorized = true;
    await Promise.all([loadBusinesses(), loadWeddings()]);
  } catch (error) {
    adminNotice("Could not initialize admin dashboard: " + error.message, "error");
    setListMessage("businessList", "Dashboard initialization failed.");
    setListMessage("weddingList", "Dashboard initialization failed.");
  }
}

document.querySelectorAll("[data-bfilter]").forEach((button) => {
  button.addEventListener("click", async () => {
    businessFilter = button.dataset.bfilter;

    document.querySelectorAll("[data-bfilter]").forEach((item) => {
      item.classList.toggle("active", item === button);
    });

    await loadBusinesses();
  });
});

document.querySelectorAll("[data-wfilter]").forEach((button) => {
  button.addEventListener("click", async () => {
    weddingFilter = button.dataset.wfilter;

    document.querySelectorAll("[data-wfilter]").forEach((item) => {
      item.classList.toggle("active", item === button);
    });

    await loadWeddings();
  });
});

adminEl("refreshBusinesses").addEventListener("click", loadBusinesses);
adminEl("refreshWeddings").addEventListener("click", loadWeddings);

document.addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  if (button.disabled) return;
  button.disabled = true;

  try {
    const action = button.dataset.action;
    const id = button.dataset.id;

    if (action === "business-approved" || action === "business-rejected") {
      await updateStatus(
        "businesses",
        id,
        action === "business-approved" ? "approved" : "rejected",
        "business"
      );
    }

    if (action === "wedding-approved" || action === "wedding-rejected") {
      await updateStatus(
        "wedding_submissions",
        id,
        action === "wedding-approved" ? "approved" : "rejected",
        "wedding"
      );
    }
  } finally {
    button.disabled = false;
  }
});

initAdmin();
</script>

</body>
</html>
