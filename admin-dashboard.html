<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — The Wed Tale</title><link rel="stylesheet" href="style.css"></head><body><nav class="site-nav"><a class="brand" href="index.html">THE WED TALE<small>GUJARAT</small></a><button class="btn-outline" data-logout>Log out</button></nav><main class="page"><header class="dashboard-head"><p class="eyebrow">ADMIN PANEL</p><h1>Control<br><em>the tale.</em></h1><p class="lede">Review business listings and wedding stories before publishing.</p></header><div id="adminNotice" class="notice"></div><section class="section" style="padding-left:0;padding-right:0"><div class="section-head"><div><p class="eyebrow">BUSINESSES</p><h2>Review listings.</h2></div></div><div class="auth-switch"><button data-bfilter="pending" class="active">PENDING</button><button data-bfilter="approved">APPROVED</button><button data-bfilter="rejected">REJECTED</button></div><div id="businessList" class="list"><div class="empty">Loading…</div></div></section><section class="section" style="padding-left:0;padding-right:0"><div class="section-head"><div><p class="eyebrow">REAL WEDDINGS</p><h2>Review submissions.</h2></div></div><div class="auth-switch"><button data-wfilter="pending" class="active">PENDING</button><button data-wfilter="approved">APPROVED</button><button data-wfilter="rejected">REJECTED</button></div><div id="weddingList" class="list"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="app.js"></script><script>
let bf='pending',wf='pending';const $=id=>document.getElementById(id);async function init(){if(!configured()){$('adminNotice').textContent=configMessage();$('adminNotice').classList.add('show');return}try{const s=await getSession();if(!s){location.href='auth.html';return}const p=await getProfile(s.user.id);if(!p||p.role!=='admin'){document.querySelector('main').innerHTML='<div class="panel"><h2>Admin access required</h2><p>This page is restricted to the account assigned the admin role.</p><a class="btn" href="index.html">HOME →</a></div>';return}await Promise.all([loadBusinesses(),loadWeddings()])}catch(e){showNotice('adminNotice','Could not load admin page: '+e.message,'error')}}async function loadBusinesses(){const {data,error}=await supabaseClient.from('businesses').select('id,name,category,city,description,status,owner_id,created_at').eq('status',bf).order('created_at',{ascending:false});if(error){$('businessList').innerHTML='<div class="empty">Could not load businesses: '+esc(error.message)+'</div>';return}$('businessList').innerHTML=data&&data.length?data.map(b=>`<article class="list-item"><div class="section-head"><div><h3>${esc(b.name)}</h3><p>${esc(b.category||'Wedding business')} · ${esc(b.city||'')}</p></div><span class="badge">${esc(b.status)}</span></div><p>${esc(b.description||'')}</p><div class="inline-actions">${bf!=='approved'?`<button class="btn" data-baction="approved" data-id="${esc(b.id)}">APPROVE</button>`:''}${bf!=='rejected'?`<button class="btn-outline" data-baction="rejected" data-id="${esc(b.id)}">REJECT</button>`:''}</div></article>`).join(''):'<div class="empty">No '+esc(bf)+' businesses.</div>';document.querySelectorAll('[data-baction]').forEach(btn=>btn.onclick=async()=>{const {error}=await supabaseClient.from('businesses').update({status:btn.dataset.baction}).eq('id',btn.dataset.id);if(error){showNotice('adminNotice','Could not update business: '+error.message,'error');return}showNotice('adminNotice','Business status updated.','success');loadBusinesses()})}async function loadWeddings(){const {data,error}=await supabaseClient.from('wedding_submissions').select('id,title,city,story,status,couple_id,created_at').eq('status',wf).order('created_at',{ascending:false});if(error){$('weddingList').innerHTML='<div class="empty">Could not load submissions: '+esc(error.message)+'</div>';return}$('weddingList').innerHTML=data&&data.length?data.map(w=>`<article class="list-item"><div class="section-head"><div><h3>${esc(w.title)}</h3><p>${esc(w.city||'')} · ${esc(w.created_at?new Date(w.created_at).toLocaleDateString():'')}</p></div><span class="badge">${esc(w.status)}</span></div><p>${esc(w.story||'')}</p><div class="inline-actions">${wf!=='approved'?`<button class="btn" data-waction="approved" data-id="${esc(w.id)}">APPROVE</button>`:''}${wf!=='rejected'?`<button class="btn-outline" data-waction="rejected" data-id="${esc(w.id)}">REJECT</button>`:''}</div></article>`).join(''):'<div class="empty">No '+esc(wf)+' wedding submissions.</div>';document.querySelectorAll('[data-waction]').forEach(btn=>btn.onclick=async()=>{const {error}=await supabaseClient.from('wedding_submissions').update({status:btn.dataset.waction}).eq('id',btn.dataset.id);if(error){showNotice('adminNotice','Could not update submission: '+error.message,'error');return}showNotice('adminNotice','Wedding submission updated.','success');loadWeddings()})}document.querySelectorAll('[data-bfilter]').forEach(b=>b.onclick=()=>{bf=b.dataset.bfilter;document.querySelectorAll('[data-bfilter]').forEach(x=>x.classList.toggle('active',x===b));loadBusinesses()});document.querySelectorAll('[data-wfilter]').forEach(b=>b.onclick=()=>{wf=b.dataset.wfilter;document.querySelectorAll('[data-wfilter]').forEach(x=>x.classList.toggle('active',x===b));loadWeddings()});init();
</script></body></html>
