
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supabase Connection Test</title>
</head>
<body>
  <h2>The Wed Tale — Connection Test</h2>
  <p id="connection">Checking connection...</p>
  <p id="result"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    async function testConnection() {
      const connection = document.getElementById("connection");
      const result = document.getElementById("result");

      if (!window.supabase) {
        connection.textContent = "ERROR: Supabase library not loaded.";
        return;
      }

      if (!window.supabaseClient) {
        connection.textContent = "ERROR: Supabase client not created.";
        return;
      }

      connection.textContent = "Supabase client created successfully.";

      const { data, error } = await window.supabaseClient
        .from("businesses")
        .select("id, name, status")
        .eq("status", "approved");

      if (error) {
        result.textContent = "Database error: " + error.message;
      } else {
        result.textContent =
          "Connection successful! Approved businesses found: " +
          data.length +
          ".";
      }
    }

    testConnection().catch(error => {
      document.getElementById("result").textContent =
        "Unexpected error: " + error.message;
    });
  </script>
</body>
</html>
